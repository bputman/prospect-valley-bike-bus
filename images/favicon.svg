<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Back wheel -->
  <circle cx="25" cy="70" r="20" fill="none" stroke="#1C2B24" stroke-width="2"/>
  <circle cx="25" cy="70" r="16" fill="none" stroke="#1C2B24" stroke-width="1" opacity="0.5"/>
  
  <!-- Front wheel -->
  <circle cx="75" cy="70" r="20" fill="none" stroke="#1C2B24" stroke-width="2"/>
  <circle cx="75" cy="70" r="16" fill="none" stroke="#1C2B24" stroke-width="1" opacity="0.5"/>
  
  <!-- Frame -->
  <line x1="25" y1="70" x2="50" y2="35" stroke="#FF6A47" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="35" x2="75" y2="70" stroke="#FF6A47" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="35" x2="25" y2="70" stroke="#FF6A47" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Seat -->
  <rect x="45" y="30" width="10" height="3" rx="1.5" fill="#1C2B24"/>
  
  <!-- Handlebars -->
  <line x1="75" y1="70" x2="75" y2="50" stroke="#1C2B24" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="48" x2="80" y2="48" stroke="#1C2B24" stroke-width="2" stroke-linecap="round"/>
</svg>